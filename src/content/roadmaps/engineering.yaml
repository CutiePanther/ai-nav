title: AI 工程化
icon: settings
target: 想做模型部署、推理优化、平台建设的工程同学
duration: 约 3~4 个月
prerequisites:
  - Linux / Docker 基础
  - Python 编程
  - 了解模型推理基本概念
stages:
  - name: 筑基：推理与部署基础
    desc: 理解模型推理流程、服务化与常见部署方式（本地/云/边缘）
    time: 2 周
    skills:
      - 模型加载
      - API 服务化
      - Ollama
      - 容器化
    tasks:
      - 用 Ollama 本地跑一个开源模型
      - 用 vLLM 起一个推理服务并调用
      - 理解推理流程（加载 → 前向 → 解码）
      - 用 Docker 打包部署
    checkpoint: 能本地起一个模型推理 API 并对外服务
    project: 用 Docker 部署一个 Ollama 推理服务
    resources:
      - label: Ollama 本地部署
        url: https://github.com/ollama/ollama
        kind: repo
      - label: vLLM 文档
        url: https://docs.vllm.ai
        kind: doc
      - label: Docker 入门
        url: https://docs.docker.com/get-started/
        kind: doc
  - name: 核心：推理优化
    desc: 掌握量化、KV Cache、批处理调度、投机采样等优化手段
    time: 3~4 周
    skills:
      - 量化
      - KV Cache
      - Continuous Batching
      - 投机采样
    tasks:
      - 理解 KV Cache 的显存占用与加速原理
      - 实践量化（GGUF / GPTQ / AWQ）并对比效果
      - 理解 Continuous Batching 的吞吐提升原理
      - 了解 FlashAttention 的 IO 优化思路
    checkpoint: 能量化一个模型，并对比吞吐 / 显存 / 质量
    project: 把一个大模型量化后部署，记录性能对比
    resources:
      - label: llama.cpp
        url: https://github.com/ggml-org/llama.cpp
        kind: repo
      - label: FlashAttention
        url: https://github.com/Dao-AILab/flash-attention
        kind: repo
      - label: Roadmap-to-LLMs
        url: https://github.com/MonitSharma/Roadmap-to-LLMs
        kind: repo
  - name: 实战：RAG 系统工程化
    desc: 构建高可用向量检索与知识库系统，处理召回、重排与数据更新
    time: 2~3 周
    skills:
      - 向量库选型
      - 混合检索
      - Rerank
      - 索引更新
    tasks:
      - 对比 FAISS / pgvector / Milvus 的选型
      - 实现向量 + BM25 混合检索
      - 接入 Rerank 重排提升精度
      - 处理索引的增量更新
    checkpoint: 能搭建高可用的向量检索服务
    project: 搭建一个带混合检索 + 重排的知识库服务
    resources:
      - label: FAISS
        url: https://github.com/facebookresearch/faiss
        kind: repo
      - label: pgvector
        url: https://github.com/pgvector/pgvector
        kind: repo
      - label: Milvus
        url: https://milvus.io/docs
        kind: doc
  - name: 进阶：可观测与稳定性
    desc: 监控延迟、成本与质量，做限流降级、灰度与 A/B 实验
    time: 2 周
    skills:
      - 监控告警
      - 限流降级
      - 灰度发布
      - 成本优化
    tasks:
      - 接入 OpenTelemetry 采集链路数据
      - 监控延迟、成本（Token 消耗）、质量
      - 实现限流与降级策略
      - 设计灰度发布与 A/B 实验
    checkpoint: 能对 LLM 服务做监控、告警与降级
    project: 给推理服务加一套监控面板 + 限流
    resources:
      - label: OpenTelemetry
        url: https://opentelemetry.io
        kind: doc
      - label: LLM 可观测
        url: https://langfuse.com
        kind: doc
  - name: 平台：分布式与调度
    desc: 多卡并行、模型服务治理、GPU 调度与平台化
    time: 3~4 周
    skills:
      - 张量并行
      - 流水线并行
      - GPU 调度
      - 服务治理
    tasks:
      - 理解张量并行 / 流水线并行 / 数据并行的区别
      - 用 SGLang 部署多卡推理
      - 了解 GPU 调度与资源隔离
      - 用 Kubernetes 部署模型服务
    checkpoint: 能部署多卡推理服务并做资源调度
    project: 用 K8s 部署一个多副本的推理服务
    resources:
      - label: SGLang
        url: https://github.com/sgl-project/sglang
        kind: repo
      - label: Kubernetes
        url: https://kubernetes.io/docs/
        kind: doc
