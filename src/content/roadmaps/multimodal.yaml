title: 多模态
icon: palette
target: 想做图文、视频、语音等多模态方向的同学
duration: 约 3~5 个月
prerequisites:
  - 深度学习基础（CNN / Transformer）
  - PyTorch 使用经验
stages:
  - name: 筑基：多模态基础
    desc: 理解图文对齐、CLIP 对比学习等基础范式与表示学习
    time: 2 周
    skills:
      - 对比学习
      - CLIP
      - 多模态表示
      - Embedding
    tasks:
      - 理解对比学习的目标与 InfoNCE 损失
      - 读懂 CLIP 论文并理解图文对齐
      - 用 CLIP 做零样本图像分类
      - 跑通图文检索 demo
    checkpoint: 能解释 CLIP 原理并用它做零样本分类
    project: 用 CLIP 做图文检索小应用
    resources:
      - label: CLIP 论文
        url: https://arxiv.org/abs/2103.00020
        kind: doc
      - label: HuggingFace 多模态课程
        url: https://huggingface.co/learn
        kind: course
  - name: 核心：扩散模型与生成
    desc: 掌握 Stable Diffusion、扩散原理与文生图生成
    time: 3~4 周
    skills:
      - 扩散模型
      - Stable Diffusion
      - ControlNet
      - 图生图
    tasks:
      - 理解扩散模型的前向加噪 / 反向去噪原理
      - 用 Diffusers 跑通 Stable Diffusion
      - 用 ControlNet 做可控生成
      - 实践图生图与 inpainting
    checkpoint: 能解释扩散模型原理并用 SD 生成图像
    project: 做一个可控文生图 demo
    resources:
      - label: HuggingFace Diffusers
        url: https://huggingface.co/docs/diffusers
        kind: doc
      - label: 扩散模型教程
        url: https://lilianweng.github.io/posts/2021-07-11-diffusion-models/
        kind: doc
  - name: 实战：多模态大模型（VLM）
    desc: 实践视觉语言模型、图文问答与多模态对话
    time: 3~4 周
    skills:
      - VLM
      - 视觉编码器
      - 多模态对齐
      - 微调
    tasks:
      - 理解 VLM 架构（视觉编码器 + LLM 对齐）
      - 用 Gemini / Qwen-VL 做图文问答
      - 微调一个 VLM 做特定任务
      - 理解多模态对齐训练
    checkpoint: 能基于 VLM 做图文问答应用
    project: 做一个「看图说话 / 图表问答」应用
    resources:
      - label: Gemini API
        url: https://ai.google.dev/gemini-api/docs
        kind: doc
      - label: Qwen-VL
        url: https://github.com/QwenLM/Qwen2.5-VL
        kind: repo
  - name: 进阶：视频与音频生成
    desc: 探索文生视频、视频理解与语音合成/克隆
    time: 3 周
    skills:
      - 视频生成
      - 语音合成
      - 音频理解
      - 实时推理
    tasks:
      - 用 Whisper 做语音转写
      - 实践文生视频（如可灵 / Sora 类）
      - 体验语音合成与克隆
      - 理解实时推理的延迟优化
    checkpoint: 能做语音转写 + 视频生成类应用
    project: 做一个「语音转文字 + 摘要」工具
    resources:
      - label: Whisper
        url: https://github.com/openai/whisper
        kind: repo
      - label: HuggingFace Papers
        url: https://huggingface.co/papers
        kind: doc
  - name: 前沿：端到端与统一架构
    desc: 追踪端到端多模态统一模型、世界模型等前沿进展
    time: 持续
    skills:
      - 统一架构
      - 世界模型
      - 具身智能
      - 多模态评测
    tasks:
      - 追踪端到端多模态统一模型进展
      - 了解世界模型（World Model）
      - 了解具身智能与多模态评测
      - 复现一个前沿多模态工作
    checkpoint: 能追踪并复现前沿多模态工作
    project: 复现一个前沿多模态论文
    resources:
      - label: arXiv 多模态
        url: https://arxiv.org/list/cs.CV/recent
        kind: doc
      - label: HuggingFace Papers
        url: https://huggingface.co/papers
        kind: doc
